name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - integrate/pilot-merge

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ===========================================================================
  # CD — runs only after all CI checks pass on push to integrate/pilot-merge
  # ===========================================================================

  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/aura
          tags: |
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/aura-backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push assistant
        uses: docker/build-push-action@v6
        with:
          context: ./assistant
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/aura-assistant:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/aura-frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/aura-postgres:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Pull latest images
            APP_ENV=prod \
            BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/aura-backend:${{ needs.build-push.outputs.tag }} \
            ASSISTANT_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/aura-assistant:${{ needs.build-push.outputs.tag }} \
            FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/aura-frontend:${{ needs.build-push.outputs.tag }} \
            POSTGRES_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/aura-postgres:${{ needs.build-push.outputs.tag }} \
            docker compose --profile prod pull

            # Run migrations before bringing up services
            APP_ENV=prod docker compose --profile prod run --rm migrate

            # Rolling restart — zero-downtime for stateless services
            APP_ENV=prod docker compose --profile prod up -d \
              --no-deps --remove-orphans \
              backend worker beat assistant frontend
